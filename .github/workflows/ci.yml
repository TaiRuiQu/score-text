name: CI
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run smoke:package
      - run: npm run demo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install lxml pymupdf
      - run: python scripts/verify-exports.py
